<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Renderer: Markdown 渲染器</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Georgia&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Fira+Code:wght@400;500&family=Source+Code+Pro&family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Space+Mono&family=IBM+Plex+Mono&family=Noto+Serif+SC:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- Marked.js -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- highlight.js -->
<link rel="stylesheet" id="hljs-theme" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<!-- html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<!-- jsPDF -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
/* ══════════════════════════════════════════════════════
   MD RENDERER — GLOBAL STYLES
══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: light;
  --app-bg: #fcfcfa;
  --topbar-bg: rgba(252, 252, 250, .96);
  --topbar-border: #e4e6df;
  --panel-bg: #f7f8f4;
  --panel-border: #dfe5dc;
  --panel-border-strong: #bfc7bc;
  --editor-bg: #fff;
  --editor-text: #3d483c;
  --preview-bg: #f2f4ef;
  --text-primary: #282d29;
  --text-secondary: #687565;
  --text-muted: #687565;
  --accent: #438865;
  --accent-hover: #397953;
  --accent-soft: #eff3ed;
  --accent-soft-strong: #eaf1e4;
  --btn-bg: #fff;
  --btn-hover: #eff3ed;
  --scrollbar: #f2f4ef;
  --scrollbar-thumb: #d5dcd0;
  --radius: 6px;
  --radius-sm: 4px;
  --topbar-h: 64px;
  --toolbar-h: 46px;
  --theme-panel-w: 280px;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--app-bg);
  color: var(--text-primary);
  font-family: "SF Pro Text", "Helvetica Neue", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}

.skip-link {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 10000;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: #202620;
  color: #fff;
  font-size: 12px;
  text-decoration: none;
  transform: translateY(-150%);
  transition: transform 160ms ease;
}
.skip-link:focus { transform: translateY(0); }

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: wait; }

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[role="button"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #b9c4b4; }

/* ══════════════════════════════════════════════════════
   TOP BAR
══════════════════════════════════════════════════════ */
.topbar {
  height: var(--topbar-h);
  background: var(--topbar-bg);
  border-bottom: 1px solid var(--topbar-border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 200;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.topbar-left { display: flex; align-items: center; gap: 9px; min-width: 190px; }
.topbar-center { flex: 1; display: flex; justify-content: center; min-width: 0; }
.topbar-right { display: flex; align-items: center; gap: 6px; min-width: 190px; justify-content: flex-end; }

.logo {
  display: inline-flex;
  align-items: baseline;
  color: #202620;
  font-size: 18px;
  font-weight: 760;
  letter-spacing: -.8px;
  line-height: 1;
  white-space: nowrap;
}
.logo span { font-weight: 420; color: #687565; }
.logo i {
  width: 6px;
  height: 6px;
  margin-left: 5px;
  border-radius: 50%;
  background: var(--accent);
}

.stats-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border: 1px solid #e7ebe4;
  border-radius: 999px;
  background: #fff;
  color: #687565;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.stats-bar .sep { color: #c4ccc0; }

.icon-btn {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: #687565;
  transition: color 160ms ease, background-color 160ms ease;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--accent); }

.export-group { display: flex; gap: 5px; }
.btn-export {
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  background: var(--btn-bg);
  color: #61705e;
  font-size: 11px;
  white-space: nowrap;
  transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease;
}
.btn-export svg { width: 14px; height: 14px; flex: 0 0 14px; }
.btn-export:hover { color: var(--accent); background: var(--accent-soft); border-color: #cbd9c8; }
.btn-export.primary { color: #fff; background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-export.primary:hover { color: #fff; background: #2f6d4c; border-color: #2f6d4c; }

/* ══════════════════════════════════════════════════════
   APP LAYOUT
══════════════════════════════════════════════════════ */
.app-layout {
  flex: 1;
  min-height: 0;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* ══════════════════════════════════════════════════════
   THEME PANEL
══════════════════════════════════════════════════════ */
.theme-panel {
  width: var(--theme-panel-w);
  background: var(--panel-bg);
  border-right: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 220ms ease, opacity 180ms ease;
  overflow: hidden;
}
.theme-panel.collapsed {
  width: 0;
  opacity: 0;
  pointer-events: none;
  border-right-width: 0;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 14px 12px;
  border-bottom: 1px solid var(--panel-border);
  color: #303d30;
  flex-shrink: 0;
}
.panel-title {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 680;
}
.panel-title svg { color: var(--accent); }
.panel-close {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: #687565;
  transition: color 160ms ease, background-color 160ms ease;
}
.panel-close:hover { background: var(--accent-soft); color: var(--accent); }

.panel-search {
  padding: 10px 12px;
  border-bottom: 1px solid var(--panel-border);
  flex-shrink: 0;
}
.panel-search input {
  width: 100%;
  min-height: 34px;
  padding: 7px 10px;
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  background: #fff;
  color: var(--text-primary);
  font-size: 12px;
  outline: none;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.panel-search input:focus {
  border-color: #9bb59a;
  box-shadow: 0 0 0 3px rgba(67, 136, 101, .08);
}
.panel-search input::placeholder { color: #687565; }

.theme-list {
  flex: 1;
  overflow-y: auto;
  padding: 7px 0 14px;
  scrollbar-color: var(--scrollbar-thumb) transparent;
  scrollbar-width: thin;
}

.theme-category-group { margin-bottom: 3px; }
.theme-cat-label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px 5px;
  color: #687565;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.theme-cat-dot {
  width: 6px;
  height: 6px;
  flex: 0 0 6px;
  border-radius: 2px;
  background: var(--accent);
}
.theme-item-count {
  margin-left: auto;
  color: #687565;
  font-size: 9px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.theme-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 1px 7px;
  padding: 7px;
  border: 1px solid transparent;
  border-left: 2px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background-color 150ms ease, border-color 150ms ease;
}
.theme-item:hover { background: #f0f3ed; border-color: #e8ece5; }
.theme-item.active {
  background: var(--accent-soft-strong);
  border-color: #d9e5d5;
  border-left-color: var(--accent);
}

/* 主题迷你预览卡 */
.theme-preview-card {
  width: 44px;
  height: 30px;
  border-radius: 3px;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid #dfe5dc;
  display: flex;
  flex-direction: column;
  padding: 3px 4px;
  gap: 2px;
  background: #fff;
}
.tpc-line { border-radius: 1px; height: 3px; }
.tpc-line.title { width: 70%; }
.tpc-line.body { width: 100%; opacity: .6; }
.tpc-line.body2 { width: 80%; opacity: .4; }
.tpc-line.code { width: 60%; opacity: .7; }

.theme-item-info { flex: 1; min-width: 0; }
.theme-item-name {
  color: #3f4b3d;
  font-size: 12px;
  font-weight: 560;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.theme-item-tag { margin-top: 1px; color: #687565; font-size: 9px; }

/* ══════════════════════════════════════════════════════
   EDITOR PANEL
══════════════════════════════════════════════════════ */
.editor-panel {
  width: clamp(340px, 32vw, 470px);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--panel-border);
  background: var(--editor-bg);
}

.panel-toolbar {
  height: var(--toolbar-h);
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 13px;
  border-bottom: 1px solid var(--panel-border);
  background: #fcfcfa;
  flex-shrink: 0;
  flex-wrap: wrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.panel-toolbar::-webkit-scrollbar { display: none; }
.panel-label {
  color: #65745f;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  white-space: nowrap;
}

.small-btn {
  min-height: 28px;
  padding: 0 9px;
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  background: #fff;
  color: #70806c;
  font-size: 10px;
  transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease;
}
.small-btn:hover { color: var(--accent); background: var(--accent-soft); border-color: #cbd9c8; }

#editor {
  flex: 1;
  min-height: 0;
  padding: 22px 24px;
  border: 0;
  outline: 0;
  resize: none;
  background: #fff;
  color: #33472f;
  caret-color: var(--accent);
  font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, monospace;
  font-size: 13px;
  line-height: 1.8;
  tab-size: 2;
  scrollbar-color: var(--scrollbar-thumb) transparent;
  scrollbar-width: thin;
}
#editor:focus-visible { outline: 2px solid rgba(67, 136, 101, .34); outline-offset: -3px; }
#editor::placeholder { color: #687565; }
#editor::selection { background: #dcebd7; color: #263b2d; }

/* ══════════════════════════════════════════════════════
   PREVIEW PANEL
══════════════════════════════════════════════════════ */
.preview-panel {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(circle at 100% 0, rgba(181, 200, 173, .18), transparent 34%),
    var(--preview-bg);
}

.preview-panel .panel-toolbar {
  height: auto;
  min-height: var(--toolbar-h);
  padding: 7px 13px;
  gap: 6px;
  flex-wrap: wrap;
}

.toolbar-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.ctrl-label {
  color: #687565;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .03em;
  white-space: nowrap;
}
.ctrl-val {
  min-width: 30px;
  color: #65745f;
  font-size: 9px;
  font-variant-numeric: tabular-nums;
}

.slider {
  -webkit-appearance: none;
  appearance: none;
  width: 68px;
  height: 28px;
  background: transparent;
  outline: none;
  cursor: pointer;
}
.slider::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 4px;
  background: #dfe5dc;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  margin-top: -4px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 1px #b8cdb6;
  cursor: pointer;
}
.slider::-moz-range-thumb {
  width: 9px;
  height: 9px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 1px #b8cdb6;
  cursor: pointer;
}
.slider::-moz-range-track {
  height: 4px;
  border-radius: 4px;
  background: #dfe5dc;
}
.slider:focus-visible { outline: 2px solid rgba(67, 136, 101, .4); outline-offset: 5px; }

.ctrl-select {
  max-width: 110px;
  min-height: 28px;
  padding: 4px 24px 4px 7px;
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  background-color: #fff;
  color: #65745f;
  font-size: 10px;
  outline: none;
  cursor: pointer;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.ctrl-select:focus {
  border-color: #9bb59a;
  box-shadow: 0 0 0 3px rgba(67, 136, 101, .08);
}

.preview-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  justify-content: center;
  padding: 34px 22px 42px;
  scrollbar-color: var(--scrollbar-thumb) transparent;
  scrollbar-width: thin;
}

.preview-content {
  width: 800px;
  max-width: 100%;
  min-height: 100%;
  transition: width 200ms ease;
}

#preview {
  min-height: 100%;
}

/* ══════════════════════════════════════════════════════
   MARKDOWN BODY BASE STYLES
══════════════════════════════════════════════════════ */
.markdown-body {
  font-size: 16px;
  line-height: 1.7;
  word-wrap: break-word;
}
.markdown-body > *:first-child { margin-top: 0 !important; }
.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 {
  margin-top: 1.5em;
  margin-bottom: .5em;
  font-weight: 600;
  line-height: 1.25;
}
.markdown-body h1 { font-size: 2em; }
.markdown-body h2 { font-size: 1.5em; }
.markdown-body h3 { font-size: 1.25em; }
.markdown-body h4 { font-size: 1em; }
.markdown-body h5 { font-size: .875em; }
.markdown-body h6 { font-size: .85em; }
.markdown-body p { margin-top: 0; margin-bottom: 1em; }
.markdown-body a { text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }
.markdown-body strong { font-weight: 600; }
.markdown-body em { font-style: italic; }
.markdown-body del { text-decoration: line-through; }
.markdown-body ul, .markdown-body ol { padding-left: 2em; margin-bottom: 1em; }
.markdown-body li { margin-bottom: .25em; }
.markdown-body li input[type="checkbox"] { margin-right: .5em; }
.markdown-body blockquote {
  margin: 1em 0;
  padding: .5em 1em;
  border-left: 4px solid #ddd;
}
.markdown-body blockquote > :last-child { margin-bottom: 0; }
.markdown-body code {
  font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  font-size: .875em;
  padding: .2em .4em;
  border-radius: 3px;
}
.markdown-body pre {
  padding: 1em;
  overflow: auto;
  border-radius: 6px;
  margin-bottom: 1em;
}
.markdown-body pre code {
  padding: 0;
  background: transparent;
  border: none;
  font-size: .875em;
}
.markdown-body table {
  border-collapse: collapse;
  width: 100%;
  margin-bottom: 1em;
  overflow: auto;
}
.markdown-body th, .markdown-body td {
  padding: .5em 1em;
  border: 1px solid #ddd;
  text-align: left;
}
.markdown-body th { font-weight: 600; }
.markdown-body hr {
  border: none;
  border-top: 1px solid #eee;
  margin: 1.5em 0;
}
.markdown-body img { max-width: 100%; }

/* ══════════════════════════════════════════════════════
   FULLSCREEN
══════════════════════════════════════════════════════ */
.fullscreen-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #fcfcfa;
  flex-direction: column;
}
.fullscreen-overlay.active { display: flex; }

.fs-toolbar {
  min-height: 56px;
  padding: 10px 22px;
  border-bottom: 1px solid var(--topbar-border);
  display: flex;
  justify-content: flex-end;
  align-items: center;
  background: rgba(252, 252, 250, .96);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.fs-close {
  min-height: 32px;
  padding: 0 11px;
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  background: #fff;
  color: #61705e;
  font-size: 11px;
  transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.fs-close:hover { color: var(--accent); background: var(--accent-soft); border-color: #cbd9c8; }

.fs-scroll {
  flex: 1;
  overflow-y: auto;
  display: flex;
  justify-content: center;
  padding: 40px 20px;
}
.fs-content {
  width: 800px;
  max-width: 100%;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  text-rendering: geometricPrecision;
}

@media print {
  html, body {
    width: auto;
    height: auto;
    margin: 0;
    padding: 0;
    background: #fff;
  }

  .fullscreen-overlay {
    display: flex !important;
    position: static;
    inset: auto;
    background: #fff;
  }

  .fs-toolbar {
    display: none !important;
  }

  .fs-scroll {
    overflow: visible;
    display: block;
    padding: 0;
  }

  .fs-content {
    width: 100% !important;
    max-width: none !important;
    margin: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    text-rendering: geometricPrecision;
  }
}

/* ══════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════ */
.toast {
  position: fixed;
  top: 22px;
  bottom: auto;
  left: 50%;
  transform: translateX(-50%) translateY(-8px);
  max-width: min(460px, calc(100vw - 32px));
  padding: 10px 16px;
  border: 0;
  border-radius: var(--radius-sm);
  background: #171917;
  color: #fff;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .2);
  font-size: 12px;
  line-height: 1.45;
  text-align: center;
  opacity: 0;
  transition: opacity 180ms ease, transform 180ms ease;
  pointer-events: none;
  z-index: 9999;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ══════════════════════════════════════════════════════
   LOADING OVERLAY
══════════════════════════════════════════════════════ */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(12, 18, 14, .72);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9998;
  color: #f5f7f2;
  font-size: 14px;
  gap: 12px;
  backdrop-filter: blur(8px);

function render() {
  const md = editor.value;
  const html = marked.parse(md);
  preview.innerHTML = html;
  fsContent.innerHTML = html;
  updateStats(md);
  if (window.hljs) {
    preview.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    fsContent.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  }
}

function updateStats(md) {
  const text = md.replace(/```[\s\S]*?```/g, '').replace(/`[^`]*`/g, '').replace(/[#*_~\[\]()>-]/g, '').trim();
  const words = text.split(/\s+/).filter(Boolean).length;
  const chars = md.length;
  const readMin = Math.max(1, Math.round(words / 300));
  document.getElementById('wordCount').textContent = words + ' 字';
  document.getElementById('charCount').textContent = chars + ' 字符';
  document.getElementById('readTime').textContent = readMin + ' 分钟阅读';
}

   THEME PANEL

function buildThemePanel(filter = '') {
  const lf = filter.toLowerCase();
  const groups = {};
  const categoryColors = {
    '经典': '#438865',
    '暗黑': '#4d5f68',
    '极简': '#b58a3d',
    '复古': '#9c6b4f',
    '创意': '#a75e7e',
    '学术': '#557c9a',
    '色彩': '#8a6f9f',
    '技术文档': '#4d7fab',
    '出版': '#785f4e',
    '特殊': '#8280a0',
  };
  THEMES.forEach(t => {
    if (lf && !t.name.toLowerCase().includes(lf) && !t.category.toLowerCase().includes(lf) && !t.tag.toLowerCase().includes(lf)) return;
    if (!groups[t.category]) groups[t.category] = [];
    groups[t.category].push(t);
  });

  themeList.innerHTML = '';
  Object.entries(groups).forEach(([cat, themes]) => {
    const group = document.createElement('div');
    group.className = 'theme-category-group';

    const label = document.createElement('div');
    label.className = 'theme-cat-label';
    const categoryName = cat.replace(/^[^\p{L}\p{N}]+/u, '').trim();
    const dot = document.createElement('i');
    dot.className = 'theme-cat-dot';
    dot.style.background = categoryColors[categoryName] || '#8d998b';
    label.append(dot, document.createTextNode(categoryName));
    const count = document.createElement('span');
    count.className = 'theme-item-count';
    count.textContent = themes.length;
    label.appendChild(count);
    group.appendChild(label);

    themes.forEach(t => {
      const item = document.createElement('div');
      item.className = 'theme-item' + (t.id === currentThemeId ? ' active' : '');
      item.dataset.id = t.id;

      const card = document.createElement('div');
      card.className = 'theme-preview-card';
      card.style.background = t.preview.bg;
      card.innerHTML = `
        <div class="tpc-line title" style="background:${t.preview.title}"></div>
        <div class="tpc-line body" style="background:${t.preview.body}"></div>
        <div class="tpc-line body2" style="background:${t.preview.body}"></div>
        <div class="tpc-line code" style="background:${t.preview.code}"></div>
      `;

      const info = document.createElement('div');
      info.className = 'theme-item-info';
      info.innerHTML = `<div class="theme-item-name">${t.name}</div><div class="theme-item-tag">${t.tag}</div>`;

      item.appendChild(card);
      item.appendChild(info);
      item.addEventListener('click', () => applyTheme(t.id));
      group.appendChild(item);
    });

    themeList.appendChild(group);
  });
}

function applyTheme(id) {
  const t = THEMES.find(x => x.id === id);
  if (!t) return;
  currentThemeId = id;

  const old = document.getElementById('active-theme-style');
  if (old) old.remove();

  const style = document.createElement('style');
  style.id = 'active-theme-style';
  style.textContent = t.css;
  document.head.appendChild(style);

  document.querySelectorAll('.theme-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  // scroll active item into view
  const activeEl = themeList.querySelector('.theme-item.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

async function renderExportCanvas(targetWidth = 1920) {
  const source = preview;
  const rect = source.getBoundingClientRect();
  const contentWidth = Math.max(Math.ceil(rect.width), Math.ceil(source.clientWidth), 1);
  const contentHeight = Math.max(Math.ceil(source.scrollHeight), Math.ceil(source.clientHeight), 1);
  const scale = Math.max(targetWidth / contentWidth, 1);

  const exportShell = document.createElement('div');
  exportShell.style.cssText = [
    'position:fixed',
    'left:-99999px',
    'top:0',
    `width:${contentWidth}px`,
    'padding:0',
    'margin:0',
    'background:#ffffff',
    'overflow:visible',
    'z-index:-1'
  ].join(';');

  const exportNode = source.cloneNode(true);
  exportNode.style.width = `${contentWidth}px`;
  exportNode.style.maxWidth = `${contentWidth}px`;
  exportNode.style.height = 'auto';
  exportNode.style.overflow = 'visible';
  exportNode.style.margin = '0';

  exportShell.appendChild(exportNode);
  document.body.appendChild(exportShell);

  try {
    return await html2canvas(exportNode, {
      scale,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      scrollX: 0,
      scrollY: 0,
      windowWidth: contentWidth,
      windowHeight: contentHeight,
      width: contentWidth,
      height: contentHeight,
    });
  } finally {
    exportShell.remove();
  }
}

}

async function exportPdf() {
  const overlay = document.createElement('div');
  overlay.className = 'loading-overlay';
  overlay.innerHTML = '<div class="loading-spinner"></div><div>正在生成高清 PDF…</div>';
  document.body.appendChild(overlay);

  try {
    const canvas = await renderExportCanvas(1920);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'p',
      unit: 'pt',
      format: 'a4',
      compress: true,
    });

    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 24;
    const usableWidth = pageWidth - margin * 2;
    const usableHeight = pageHeight - margin * 2;

    const imgWidth = canvas.width;
    const imgHeight = canvas.height;
    const pagePixelHeight = Math.floor((usableHeight * imgWidth) / usableWidth);

    let renderedHeight = 0;
    let pageIndex = 0;

    while (renderedHeight < imgHeight) {
      const sliceHeight = Math.min(pagePixelHeight, imgHeight - renderedHeight);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = imgWidth;
      pageCanvas.height = sliceHeight;
      pageCanvas.getContext('2d').drawImage(
        canvas,
        0, renderedHeight, imgWidth, sliceHeight,
        0, 0, imgWidth, sliceHeight
      );

      const sliceData = pageCanvas.toDataURL('image/png', 1.0);
      const renderHeightPt = (sliceHeight * usableWidth) / imgWidth;

      if (pageIndex > 0) pdf.addPage();
      pdf.addImage(sliceData, 'PNG', margin, margin, usableWidth, renderHeightPt, undefined, 'FAST');

      renderedHeight += sliceHeight;
      pageIndex += 1;
    }

    pdf.save('markdown-export.pdf');
    showToast('PDF 已导出');
  } catch (err) {
    showToast('PDF 导出失败：' + err.message);
  } finally {
    overlay.remove();
  }
}

  navigator.clipboard.writeText(full).then(() => {
    showToast('HTML 已复制到剪贴板');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = full;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    showToast('HTML 已复制');
  });
}

/* ══════════════════════════════════════════════════════
   EVENT LISTENERS
══════════════════════════════════════════════════════ */
// Editor
editor.addEventListener('input', render);

// Theme panel toggle
const themeToggle = document.getElementById('toggleThemePanel');
function setThemePanelOpen(open) {
  themePanel.classList.toggle('collapsed', !open);
  themeToggle.setAttribute('aria-expanded', String(open));
  themeToggle.setAttribute('aria-label', open ? '关闭主题面板' : '打开主题面板');
  themeToggle.title = open ? '关闭主题面板' : '打开主题面板';
}
themeToggle.addEventListener('click', () => {
  setThemePanelOpen(themePanel.classList.contains('collapsed'));
});
const compactLayoutQuery = window.matchMedia('(max-width: 820px)');
compactLayoutQuery.addEventListener?.('change', event => {
  if (event.matches) setThemePanelOpen(false);
});
document.getElementById('closeThemePanel').addEventListener('click', () => {
  setThemePanelOpen(false);
  themeToggle.focus();
});

// Theme search
themeSearch.addEventListener('input', e => buildThemePanel(e.target.value));

// Controls
['fontSize','lineHeight','contentWidth','cnFont','enFont'].forEach(id => {
  document.getElementById(id).addEventListener('input', applyControls);
  document.getElementById(id).addEventListener('change', applyControls);
});

// Code theme
document.getElementById('codeTheme').addEventListener('change', e => applyCodeTheme(e.target.value));

// Editor buttons
document.getElementById('clearEditor').addEventListener('click', () => {
  editor.value = '';
  render();
});
document.getElementById('loadDemo').addEventListener('click', () => {
  editor.value = DEMO_CONTENT;
  render();
});

// Fullscreen
document.getElementById('toggleFullscreen').addEventListener('click', () => {
  document.getElementById('fullscreenOverlay').classList.add('active');
});
document.getElementById('closeFullscreen').addEventListener('click', () => {
  document.getElementById('fullscreenOverlay').classList.remove('active');
});

// Export
document.getElementById('exportImg').addEventListener('click', exportImage);
document.getElementById('exportPdf').addEventListener('click', exportPdf);
document.getElementById('copyHtml').addEventListener('click', copyHtml);

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('fullscreenOverlay').classList.remove('active');
    if (window.matchMedia('(max-width: 820px)').matches && !themePanel.classList.contains('collapsed')) {
      setThemePanelOpen(false);
      themeToggle.focus();
    }
  }
});

/* ══════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════ */
buildThemePanel();
applyTheme('github-light');
setThemePanelOpen(!compactLayoutQuery.matches);
editor.value = DEMO_CONTENT;
render();
applyControls();
</script>
